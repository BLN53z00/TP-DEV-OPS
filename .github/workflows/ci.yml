name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Lint de l'API (Ruff)
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt
          ruff check .
          ruff format --check .
      - name: Lint du front (ESLint + TypeScript)
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run typecheck

  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Tests de l'API (pytest + couverture)
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt
          pytest

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Tests du front (Vitest) et build de production
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

  e2e:
    needs: [lint, test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Démarrer la stack Docker Compose
        run: |
          cp .env.example .env
          docker compose up --build -d --wait
      - name: Attendre que l'API soit prête
        run: curl --fail --retry 30 --retry-delay 2 --retry-all-errors http://localhost:8000/health/ready
      - name: Installer Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Tests de bout en bout
        working-directory: frontend
        run: npm run test:e2e
      - name: Conserver le rapport Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
      - name: Logs des conteneurs (en cas d'échec)
        if: ${{ failure() }}
        run: docker compose logs
      - name: Arrêter la stack
        if: ${{ always() }}
        run: docker compose down -v